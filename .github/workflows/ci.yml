name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Chaque lundi : détecte les nouvelles failles des dépendances même sans nouveau commit
    - cron: '0 6 * * 1'

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: palmares
          POSTGRES_USER: palmares
          POSTGRES_PASSWORD: palmares
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U palmares"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Valeurs propres à la CI, sans lien avec la production
      SECRET_KEY: ci-only-secret-key-0123456789-abcdefghijklmnopqrstuvwxyz
      DATABASE_URL: postgres://palmares:palmares@localhost:5432/palmares
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Bibliothèques système (WeasyPrint)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 libgdk-pixbuf-2.0-0 shared-mime-info fonts-liberation
      - run: pip install -r requirements-dev.txt
      - name: Les migrations correspondent aux modèles
        run: python manage.py makemigrations --check --dry-run
      - run: pytest

  vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Failles des dépendances Python
        run: |
          pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Failles des dépendances front
        run: |
          npm ci
          npm audit --audit-level=moderate
