# Pas d'upstream block — on utilise une variable pour forcer
# la re-résolution DNS via le resolver Docker (127.0.0.11)

# Rate limiting zones (clé = vraie IP du client, voir real_ip plus bas)
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_status 429;

# Protocole vu par Django : celui annoncé par Traefik, sinon celui de la connexion
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # ── IP réelle du client ──────────────────────────────────────
    # nginx est derrière Traefik (Dokploy) : sans cela, $remote_addr est l'IP de Traefik et le
    # rate limiting compterait TOUS les utilisateurs comme un seul. On ne fait confiance à
    # X-Forwarded-For que s'il vient d'une adresse privée (réseaux Docker).
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Docker internal DNS — re-résout web:8000 toutes les 10s
    # OBLIGATOIRE avec proxy_pass via variable (sinon résolution faite 1 seule fois au démarrage)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream http://web:8000;

    # Un lot = 100 fichiers de 20 Mo max, 100 Mo au total (voir IMPORT_MAX_* dans les settings Django)
    client_max_body_size 110M;
    client_body_buffer_size 1m;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Headers de sécurité
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Plus aucun script externe : Tailwind et HTMX sont hébergés par l'application.
    # 'unsafe-inline' reste nécessaire tant que les templates contiennent des scripts et gestionnaires inline.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;

    # Fichiers statiques (cache long)
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # PAS de location /media/ : les fichiers Excel importés contiennent des données d'élèves
    # et ne doivent jamais être accessibles sans authentification. Rien dans l'application
    # n'a besoin de les exposer.
    location /media/ {
        return 404;
    }

    # Rate limiting sur les formulaires de connexion (site et admin)
    location ~ ^/(accounts/login|admin/login)/ {
        limit_req zone=login burst=3 nodelay;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Proxy vers Django
    location / {
        limit_req zone=general burst=20 nodelay;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_hide_header X-Powered-By;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Retry automatique si le upstream est temporairement indisponible
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 15s;

        # Page d'erreur personnalisée en cas d'échec total
        error_page 502 503 504 /maintenance.html;
        # (une directive error_page dans un bloc masque celles du niveau supérieur : il faut répéter le 413)
        error_page 413 @too_large;
    }

    # Envoi trop volumineux : message clair au lieu d'une page d'erreur nginx
    error_page 413 @too_large;
    location @too_large {
        default_type text/html;
        charset utf-8;
        return 413 '<!DOCTYPE html><html lang="fr"><meta charset="utf-8"><title>Envoi trop volumineux</title><body style="font-family:sans-serif;max-width:32rem;margin:4rem auto;padding:0 1rem"><h1>Envoi trop volumineux</h1><p>Les fichiers dépassent la taille maximale autorisée (100 Mo au total). Envoyez-les en plusieurs lots.</p><p><a href="/imports/upload/">Retour</a></p></body></html>';
    }

    # Page de maintenance (fichier statique autonome)
    location = /maintenance.html {
        root /etc/nginx;
        internal;
    }

    # Bloquer les robots indexeurs (app privée interne)
    location = /robots.txt {
        return 200 "User-agent: *\nDisallow: /\n";
        add_header Content-Type text/plain;
        access_log off;
    }

    # Favicon silencieux (évite les 404 répétés dans les logs)
    location = /favicon.ico {
        return 204;
        access_log off;
        log_not_found off;
    }

    # Bloquer l'accès aux fichiers cachés
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
